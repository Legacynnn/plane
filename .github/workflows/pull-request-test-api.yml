name: Test API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "reopened"
    paths:
      - "apps/api/**"
      - "docker-compose-test.yml"
      - ".github/workflows/pull-request-test-api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - name: Create the API env file
        run: |
          cp apps/api/.env.example apps/api/.env
          echo "SECRET_KEY=\"$(openssl rand -hex 32)\"" >> apps/api/.env
      - name: Run the API test suite
        run: docker compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
